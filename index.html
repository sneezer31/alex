<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大図書館 アレキサンドリア</title>
    <style>
        /* ==========================================
           1. 基本レイアウトとUIの美学（吹き出し排除）
        ========================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Yu Mincho", "MS PMincho", "Hiragino Mincho ProN", serif; background-color: #f4f4f5; color: #2c3e50; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* コントロールヘッダー */
        header { background-color: #34495e; color: #ecf0f1; padding: 12px 20px; flex: none; display: flex; gap: 15px; align-items: center; font-family: sans-serif; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10; }
        .control-group { display: flex; gap: 8px; align-items: center; }
        input[type="file"] { font-size: 12px; max-width: 200px; color: #bdc3c7; }
        input[type="text"], input[type="date"] { padding: 6px; font-size: 14px; border: 1px solid #7f8c8d; border-radius: 4px; background: #ecf0f1; color: #2c3e50; outline: none; }
        button { padding: 6px 12px; font-size: 13px; font-weight: bold; color: #fff; background-color: #2980b9; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #3498db; }
        button.btn-danger { background-color: #c0392b; }
        .header-title { font-size: 16px; font-weight: bold; letter-spacing: 2px; color: #f1c40f; margin-right: auto; }

        /* 読書領域（ビューア） */
        #viewer { flex: 1; overflow-y: auto; padding: 30px 10%; background-color: #fafafa; }
        
        /* 戯曲・ドキュメント形式のターンスタイル */
        .log-turn { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px dashed #bdc3c7; }
        .log-meta { font-family: sans-serif; font-size: 12px; color: #7f8c8d; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
        .sender-name { font-weight: bold; font-size: 15px; letter-spacing: 1px; }
        .sender-user { color: #2980b9; }
        .sender-ai { color: #27ae60; }
        
        /* 検索ワードと本文の描画 */
        .search-word { font-family: sans-serif; font-size: 12px; color: #8e44ad; font-weight: bold; margin-bottom: 10px; background: #f4f4f5; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .log-text { font-size: 16px; line-height: 1.8; padding-left: 1.5em; white-space: pre-wrap; word-wrap: break-word; }
        mark { background-color: #f1c40f; padding: 0 4px; font-weight: bold; border-radius: 2px; color: #2c3e50; }
        
        .empty-state { text-align: center; color: #95a5a6; font-family: sans-serif; margin-top: 50px; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <header>
        <div class="header-title">🏛️ アレキサンドリア</div>
        <div class="control-group">
            <input type="file" id="import-files" multiple accept=".json" title="複数のJSONをまとめて取り出し">
            <button id="btn-import">DBへ取り出し</button>
        </div>
        <div class="control-group">
            <input type="date" id="calendar-input" title="日付でジャンプ">
        </div>
        <div class="control-group">
            <input type="text" id="search-input" placeholder="全文検索...">
            <button id="btn-search">検索 / 絞り込み</button>
        </div>
        <button id="btn-clear-db" class="btn-danger" style="margin-left: auto;">DB全消去</button>
    </header>

    <div id="viewer">
        <div class="empty-state">
            巨大な歴史のJSONファイルをDBに取り出してください。<br>
            （thinkingは自動で排除され、純粋な対話のみが描画されます）
        </div>
    </div>

    <script>
        // ==========================================
        // 1. IndexedDBの非同期セットアップ
        // ==========================================
        const DB_NAME = "AlexandriaDB";
        const STORE_NAME = "logs";
        let db;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        // タイムスタンプを主キーにして重複インポートを物理的に防ぐ
                        const store = db.createObjectStore(STORE_NAME, { keyPath: "time" });
                        store.createIndex("sender", "sender", { unique: false });
                    }
                };
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onerror = (e) => { reject(e.target.error); };
            });
        };

        // ==========================================
        // 2. DBへの書き込み（取り出し）と読み出し
        // ==========================================
        const upsertLogs = (logArray) => {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                const store = tx.objectStore(STORE_NAME);
                logArray.forEach(log => {
                    // 最低限必要なデータ(timeとtext)があるものだけ取り込む
                    if (log.time && log.text) store.put(log); 
                });
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e.target.error);
            });
        };

        const getAllLogs = () => {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const store = tx.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => {
                    // 時間順にソート（文字列比較 "2026/10/20(火) 18:12" など）
                    const sorted = request.result.sort((a, b) => a.time.localeCompare(b.time));
                    resolve(sorted);
                };
                request.onerror = (e) => reject(e.target.error);
            });
        };

        const clearDB = () => {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                const store = tx.objectStore(STORE_NAME);
                const request = store.clear();
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        };

        // ==========================================
        // 3. UI描画・検索フィルターロジック
        // ==========================================
        const viewer = document.getElementById("viewer");
        let currentLogs = []; // メモリ上のキャッシュ

        const escapeRegExp = (string) => {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        };

        const renderLogs = (logs, highlightQuery = "") => {
            viewer.innerHTML = "";
            if (logs.length === 0) {
                viewer.innerHTML = '<div class="empty-state">表示する歴史がありません。</div>';
                return;
            }

            // 検索キーワードのハイライト用正規表現
            const regex = highlightQuery ? new RegExp(`(${escapeRegExp(highlightQuery)})`, "gi") : null;

            // DOM操作を軽くするためのフラグメント
            const fragment = document.createDocumentFragment();

            logs.forEach(log => {
                const div = document.createElement("div");
                div.className = "log-turn";
                
                // カレンダー検索用に日付属性を付与 ("YYYY/MM/DD")
                const dateMatch = log.time.match(/^\d{4}\/\d{2}\/\d{2}/);
                if (dateMatch) {
                    const dateStr = dateMatch[0].replace(/\//g, "-"); // "2026-10-20"
                    div.setAttribute("data-date", dateStr);
                }

                const isUser = log.sender === "船長";
                const senderClass = isUser ? "sender-user" : "sender-ai";

                // メタ情報（名前と時間）
                let innerHTML = `
                    <div class="log-meta">
                        <span class="sender-name ${senderClass}">${log.sender}</span>
                        <span>${log.time}</span>
                    </div>
                `;

                // 検索ワードの描画（19号で改修したプロパティ）
                if (log.search_word) {
                    let dispSearch = log.search_word;
                    if (regex) dispSearch = dispSearch.replace(regex, "<mark>$1</mark>");
                    innerHTML += `<div class="search-word">🔍 検索: ${dispSearch}</div>`;
                }

                // 本文の描画（thinkingは完全に無視し、テキストだけを出す）
                let displayText = log.text;
                if (regex) displayText = displayText.replace(regex, "<mark>$1</mark>");
                innerHTML += `<div class="log-text">${displayText}</div>`;

                div.innerHTML = innerHTML;
                fragment.appendChild(div);
            });

            viewer.appendChild(fragment);
        };

        const loadAndDisplayAll = async () => {
            currentLogs = await getAllLogs();
            renderLogs(currentLogs);
            // 読み込み直後は一番下（最新）へスクロール
            if(currentLogs.length > 0) {
                setTimeout(() => { viewer.scrollTop = viewer.scrollHeight; }, 100);
            }
        };

        // ==========================================
        // 4. イベントリスナー（フロントエンドのハッキング）
        // ==========================================

        // DBへのインポート（複数ファイルの一括取り出し）
        document.getElementById("btn-import").addEventListener("click", async () => {
            const files = document.getElementById("import-files").files;
            if (files.length === 0) return alert("取り出すJSONファイルを選択してください。");

            document.getElementById("btn-import").textContent = "取り出し中...";
            document.getElementById("btn-import").disabled = true;

            let totalImported = 0;
            for (let i = 0; i < files.length; i++) {
                const text = await files[i].text();
                try {
                    const json = JSON.parse(text);
                    await upsertLogs(json);
                    totalImported += json.length;
                } catch (e) {
                    console.error("Parse Error in file " + files[i].name, e);
                }
            }
            
            document.getElementById("import-files").value = "";
            document.getElementById("btn-import").textContent = "DBへ取り出し";
            document.getElementById("btn-import").disabled = false;
            
            alert(`${totalImported}ターンの歴史を大図書館に取り出しました！`);
            loadAndDisplayAll();
        });

        // DBの全消去
        document.getElementById("btn-clear-db").addEventListener("click", async () => {
            if (confirm("大図書館のインデックスを完全に焼き払いますか？（元のJSONファイルは消えません）")) {
                await clearDB();
                currentLogs = [];
                renderLogs(currentLogs);
            }
        });

        // テキスト全文検索（超高速メモリフィルタリング）
        document.getElementById("btn-search").addEventListener("click", () => {
            const query = document.getElementById("search-input").value.trim();
            if (!query) return renderLogs(currentLogs);

            // 本文(text)か検索ワード(search_word)に該当するものだけを抽出
            const filtered = currentLogs.filter(log => 
                (log.text && log.text.includes(query)) || 
                (log.search_word && log.search_word.includes(query))
            );
            renderLogs(filtered, query);
        });

        document.getElementById("search-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") document.getElementById("btn-search").click();
        });

        // カレンダー連動ジャンプ（HTML5ネイティブUIのハック）
        document.getElementById("calendar-input").addEventListener("change", (e) => {
            const targetDate = e.target.value; // "YYYY-MM-DD"形式
            if (!targetDate) return;

            // まず全ログを表示状態に戻す（絞り込みを解除）
            document.getElementById("search-input").value = "";
            renderLogs(currentLogs);

            // 該当する日付の最初のログ要素を探してシームレスにスクロール
            setTimeout(() => {
                const targetElement = document.querySelector(`.log-turn[data-date="${targetDate}"]`);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: "smooth", block: "start" });
                    
                    // 強調アニメーション（フラッシュ効果）
                    const originalBg = targetElement.style.backgroundColor;
                    targetElement.style.backgroundColor = "#fff9c4";
                    targetElement.style.transition = "background-color 2s";
                    setTimeout(() => { targetElement.style.backgroundColor = originalBg; }, 2000);
                } else {
                    alert("その日付の歴史はDBに存在しません。");
                }
            }, 100);
        });

        // 起動時にDBを開いて展開
        initDB().then(() => loadAndDisplayAll()).catch(e => console.error("DB Init Error:", e));
    </script>
</body>
</html>
